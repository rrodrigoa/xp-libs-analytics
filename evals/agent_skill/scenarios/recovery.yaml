- id: recovery-window
  category: recovery
  description: Count all records in the authorized snapshot. Repair the prior failed
    attempt; no fields, filters, grouping or time range are needed for this count.
  fixture: telemetry.jsonl
  user_prompt: Count all records in the authorized snapshot. Repair the prior failed
    attempt; no fields, filters, grouping or time range are needed for this count.
  expected:
    outcome: success
    query:
      aggregations:
      - op: count
        as: n
    required_tools:
    - analytics_query
  allowed_tools:
  - analytics_capabilities
  - analytics_describe
  - analytics_error_info
  - analytics_explain_query
  - analytics_list_datasets
  - analytics_query
  - analytics_unregister_dataset
  - analytics_validate_query
  limits:
    max_turns: 12
    max_tool_calls: 12
    timeout: 300
  recovery:
    query:
      casts:
      - field: /ts
        to: datetime
        format: rfc3339
        on_error: reject
      time_range:
        field: /ts
        start: '2026-11-06T10:00:00Z'
        end: '2026-11-06T11:00:00Z'
      window:
        type: tumbling
        size: 2m
      aggregations:
      - op: count
        as: n
    error_code: QUERY_WINDOW_INVALID
    discover_required: false
