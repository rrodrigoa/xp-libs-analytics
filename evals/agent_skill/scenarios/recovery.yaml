- id: recovery-matching-regex
  category: recovery
  description: Count actor names containing Peter as literal text, case-sensitive.
    Repair the earlier unsupported regex with literal matching.
  fixture: matching.jsonl
  user_prompt: Count actor names containing Peter as literal text, case-sensitive.
    Repair the earlier unsupported regex with literal matching.
  expected:
    outcome: success
    query:
      filters:
      - field: /actor/name
        op: contains
        value: Peter
      aggregations:
      - op: count
        as: n
    required_tools:
    - analytics_query
  allowed_tools:
  - analytics_capabilities
  - analytics_describe
  - analytics_error_info
  - analytics_explain_query
  - analytics_list_datasets
  - analytics_query
  - analytics_unregister_dataset
  - analytics_validate_query
  limits:
    max_turns: 12
    max_tool_calls: 12
    timeout: 300
  recovery:
    query:
      filters:
      - field: /actor/name
        op: regex
        value: (?<=P)eter
      aggregations:
      - op: count
        as: n
    error_code: MATCH_REGEX_INVALID
    discover_required: false
- id: recovery-matching-score
  category: recovery
  description: Count actor names with ratio similarity to Peter >=85. Repair the earlier
    invalid threshold using the requested 85.
  fixture: matching.jsonl
  user_prompt: Count actor names with ratio similarity to Peter >=85. Repair the earlier
    invalid threshold using the requested 85.
  expected:
    outcome: success
    query:
      filters:
      - field: /actor/name
        op: fuzzy
        value: Peter
        algorithm: ratio
        min_score: 85
      aggregations:
      - op: count
        as: n
    required_tools:
    - analytics_query
  allowed_tools:
  - analytics_capabilities
  - analytics_describe
  - analytics_error_info
  - analytics_explain_query
  - analytics_list_datasets
  - analytics_query
  - analytics_unregister_dataset
  - analytics_validate_query
  limits:
    max_turns: 12
    max_tool_calls: 12
    timeout: 300
  recovery:
    query:
      filters:
      - field: /actor/name
        op: fuzzy
        value: Peter
        algorithm: ratio
        min_score: 20
      aggregations:
      - op: count
        as: n
    error_code: MATCH_FUZZY_THRESHOLD_INVALID
    discover_required: false
