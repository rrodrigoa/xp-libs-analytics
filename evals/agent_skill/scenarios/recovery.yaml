scenarios:
- id: recovery-unknown-field
  category: recovery
  description: Inspect the authorized schema and report the arithmetic mean of value
    measurements, excluding null and missing samples. Repair the prior unknown-field
    failure.
  fixture: telemetry.jsonl
  user_prompt: Inspect the authorized schema and report the arithmetic mean of value
    measurements, excluding null and missing samples. Repair the prior unknown-field
    failure.
  expected:
    outcome: success
    query:
      aggregations:
      - op: avg
        field: /value
        as: mean
    required_tools:
    - analytics_query
  allowed_tools:
  - analytics_capabilities
  - analytics_describe
  - analytics_error_info
  - analytics_explain_query
  - analytics_list_datasets
  - analytics_query
  - analytics_unregister_dataset
  - analytics_validate_query
  limits:
    max_turns: 12
    max_tool_calls: 12
    timeout: 300
  recovery:
    query:
      aggregations:
      - op: sum
        field: /typo
        as: n
    error_code: DATA_FIELD_UNKNOWN
    discover_required: true
