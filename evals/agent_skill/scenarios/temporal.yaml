scenarios:
- id: window-tumbling-1m
  category: temporal
  description: Count records in tumbling UTC windows of 1m, between 10:00 inclusive
    and 11:00 exclusive on 2026-11-06. Report both window bounds.
  fixture: telemetry.jsonl
  user_prompt: Count records in tumbling UTC windows of 1m, between 10:00 inclusive
    and 11:00 exclusive on 2026-11-06. Report both window bounds.
  expected:
    outcome: success
    query:
      casts:
      - field: /ts
        to: datetime
        format: rfc3339
        on_error: reject
      time_range:
        field: /ts
        start: '2026-11-06T10:00:00Z'
        end: '2026-11-06T11:00:00Z'
      window:
        type: tumbling
        size: 1m
      aggregations:
      - op: count
        as: n
    required_tools:
    - analytics_query
  allowed_tools:
  - analytics_capabilities
  - analytics_describe
  - analytics_error_info
  - analytics_explain_query
  - analytics_list_datasets
  - analytics_query
  - analytics_unregister_dataset
  - analytics_validate_query
  limits:
    max_turns: 12
    max_tool_calls: 12
    timeout: 300
